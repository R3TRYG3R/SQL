<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Əlaqə</title>
    <style>
        :root {
            --grad: linear-gradient(135deg, #7AC943, #00AEEF, #0054A6);
            --text-dark: #2b2b2b;
            --text-gray: #555;
            --bg: #f3f6fa;
        }

        body {
            font-family: "Holcim Type", sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        .animated-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--grad);
            z-index: 1000;
            transform-origin: left;
            transition: all 0.3s ease;
        }

        .animated-line::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                #7AC943 0%, 
                #00AEEF 25%, 
                #0054A6 50%, 
                #00AEEF 75%, 
                #7AC943 100%);
            background-size: 200% 100%;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--grad);
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 80%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
            75% { transform: translateY(-30px) rotate(270deg); }
        }

        .section-title {
            max-width: 1000px;
            margin: 0 auto 12px;
            text-align: center;
            font-weight: 700;
            font-size: clamp(20px, 2.5vw, 32px);
            line-height: 1.2;
            color: var(--text-dark);
            position: relative;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 120px;
            height: 4px;
            margin: 0 auto 0;
            border-radius: 999px;
            background: var(--grad);
        }

        .contact-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .contact-info {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .contact-info::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2px;
            background: var(--grad);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .contact-info:hover::before {
            opacity: 1;
        }

        .contact-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(122, 201, 67, 0.05), rgba(0, 174, 239, 0.05));
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            transform: translateX(5px);
            background: linear-gradient(135deg, rgba(122, 201, 67, 0.1), rgba(0, 174, 239, 0.1));
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            background: var(--grad);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
            color: white;
        }

        .contact-details h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0 0 5px 0;
        }

        .contact-details p {
            font-size: 14px;
            color: var(--text-gray);
            margin: 0;
        }

        .contact-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .contact-form::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2px;
            background: var(--grad);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .contact-form:hover::before {
            opacity: 1;
        }

        .contact-form h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 30px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: "Holcim Type", sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7AC943;
            background: white;
            box-shadow: 0 0 0 3px rgba(122, 201, 67, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            width: 100%;
            background: var(--grad);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: "Holcim Type", sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 174, 239, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 174, 239, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 30px auto;
            }

            .contact-info,
            .contact-form {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .contact-item {
                padding: 12px;
            }

            .contact-icon {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .contact-container {
                padding: 0 10px;
                margin: 20px auto;
            }

            .contact-info,
            .contact-form {
                padding: 20px;
            }

            .contact-info h2,
            .contact-form h2 {
                font-size: 20px;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                padding: 12px;
                font-size: 14px;
            }

            .submit-btn {
                padding: 15px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Анимированная линия -->
    <div class="animated-line" id="animatedLine"></div>
    
    <!-- Плавающие фигуры -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <h1 class="section-title">ƏLAQƏ</h1>
    
    <div class="contact-container">
        <!-- Контактная информация -->
        <div class="contact-info">
            <h2>Bizimlə Əlaqə</h2>
            
            <div class="contact-item">
                <div class="contact-icon">📍</div>
                <div class="contact-details">
                    <h3>Ünvan</h3>
                    <p>Bakı, Azərbaycan<br>Holcim Azərbaycan MMC</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">📞</div>
                <div class="contact-details">
                    <h3>Telefon</h3>
                    <p>+994 12 XXX XX XX<br>+994 50 XXX XX XX</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">✉️</div>
                <div class="contact-details">
                    <h3>E-mail</h3>
                    <p>info@holcim.az<br>sales@holcim.az</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">🕒</div>
                <div class="contact-details">
                    <h3>İş Saatları</h3>
                    <p>Bazar ertəsi - Cümə<br>09:00 - 18:00</p>
                </div>
            </div>
        </div>

        <!-- Форма обратной связи -->
        <div class="contact-form">
            <h2>Bizə Yazın</h2>
            <form id="contactForm">
                <!-- Скрытые поля для Drupal (заглушки) -->
                <input type="hidden" name="form_build_id" id="form_build_id" value="form-dummy-id">
                <input type="hidden" name="form_token" id="form_token" value="dummy-token">
                <input type="hidden" name="form_id" value="webform_submission_example_webform_node_8_add_form">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">Ad *</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Soyad *</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date_of_birth">Doğum tarixi</label>
                    <input type="date" id="date_of_birth" name="date_of_birth">
                </div>

                <div class="form-group">
                    <label for="employees">İşçi sayı</label>
                    <select id="employees" name="employees">
                        <option value="">Seçin</option>
                        <option value="1-10">1-10</option>
                        <option value="11-50">11-50</option>
                        <option value="51-200">51-200</option>
                        <option value="200+">200+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Şifrə</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="address_address">Ünvan</label>
                    <input type="text" id="address_address" name="address[address]">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="address_city">Şəhər</label>
                        <input type="text" id="address_city" name="address[city]">
                    </div>
                    <div class="form-group">
                        <label for="address_state_province">Rayon</label>
                        <input type="text" id="address_state_province" name="address[state_province]">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="address_postal_code">Poçt indeksi</label>
                        <input type="text" id="address_postal_code" name="address[postal_code]">
                    </div>
                    <div class="form-group">
                        <label for="phone">Telefon</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>

                <div class="form-group">
                    <label for="your_interests">Maraq dairələri</label>
                    <textarea id="your_interests" name="your_interests" placeholder="Maraq dairələrinizi yazın..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn" name="op" value="Submit">
                        Göndər
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Анимация линии при прокрутке
        function animateLineOnScroll() {
            const line = document.getElementById('animatedLine');
            const scrollTop = window.pageYOffset;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = scrollTop / docHeight;
            
            // Изменение ширины линии
            const lineWidth = 20 + (scrollPercent * 80);
            line.style.width = lineWidth + '%';
            
            // Изменение позиции линии
            const linePosition = scrollPercent * 100;
            line.style.left = linePosition + '%';
            
            // Изменение высоты линии
            const lineHeight = 2 + (scrollPercent * 6);
            line.style.height = lineHeight + 'px';
            
            // Изменение формы линии (извивание)
            const waveIntensity = Math.sin(scrollPercent * Math.PI * 4) * 10;
            line.style.transform = `translateY(${waveIntensity}px) skewX(${scrollPercent * 5}deg)`;
            
            // Изменение прозрачности
            line.style.opacity = 0.7 + (scrollPercent * 0.3);
        }

        // Анимация фоновых фигур
        function animateShapesOnScroll() {
            const shapes = document.querySelectorAll('.shape');
            const scrollTop = window.pageYOffset;
            
            shapes.forEach((shape, index) => {
                const speed = 0.5 + (index * 0.2);
                const yPos = scrollTop * speed;
                const rotation = scrollTop * 0.1;
                
                shape.style.transform = `translateY(${yPos}px) rotate(${rotation}deg)`;
                
                // Изменение размера при прокрутке
                const scale = 0.8 + (Math.sin(scrollTop * 0.01 + index) * 0.2);
                shape.style.transform += ` scale(${scale})`;
            });
        }

        // Обработка формы
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Показываем индикатор загрузки
            const submitBtn = this.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Göndərilir...';
            submitBtn.disabled = true;
            
            // Собираем данные формы
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Выводим данные в консоль для проверки
            console.log('Form data:', data);
            
            // Имитируем отправку (замените на реальную отправку)
            setTimeout(() => {
                // Успешная отправка
                alert('Mesajınız uğurla göndərildi! Tezliklə sizinlə əlaqə saxlayacağıq.');
                this.reset();
                
                // Восстанавливаем кнопку
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }, 1000);
        });

        // Инициализация анимаций
        document.addEventListener('DOMContentLoaded', () => {
            // Анимация при скролле
            window.addEventListener('scroll', () => {
                animateLineOnScroll();
                animateShapesOnScroll();
            });
        });
    </script>
</body>
</html>
