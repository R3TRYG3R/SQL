<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beton Məhsulları</title>
    <style>
        :root {
            --grad: linear-gradient(135deg, #7AC943, #00AEEF, #0054A6);
            --text-dark: #2b2b2b;
            --text-gray: #555;
            --bg: #f3f6fa;
        }

        body {
            font-family: "Holcim Type", sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 80px 0 0 0;
        }

        .main_wrapper {
            display: grid;
            gap: 24px;
            padding: 40px 5vw;
            grid-template-columns: 1fr;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        /* планшет — 2 колонки */
        @media (min-width: 600px) {
            .main_wrapper {
                grid-template-columns: repeat(2, minmax(250px, 1fr));
                max-width: 600px;
            }
        }

        a.card_block_wrapper {
            display: block;
            text-decoration: none;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
            border: 2px solid transparent;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        a.card_block_wrapper::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: var(--grad);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        a.card_block_wrapper:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 32px rgba(0,0,0,0.15);
        }

        a.card_block_wrapper:hover::before {
            opacity: 1;
        }

        .card_block {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card_block_upper {
            position: relative;
            height: 180px;
            background: linear-gradient(135deg, rgba(122, 201, 67, 0.1), rgba(0, 174, 239, 0.1), rgba(0, 84, 166, 0.1));
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card_block_upper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            position: relative;
        }

        /* Специальные стили для обычного бетона */
        .card_block_wrapper:first-child .card_block_upper {
            border-radius: 16px 16px 0 0;
        }

        .card_block_wrapper:first-child .card_block_upper img {
            border-radius: 16px 16px 0 0;
        }

        /* Стили для ECOPact (как было) */
        .card_block_wrapper:last-child .card_block_upper {
            border-radius: 0;
        }

        .card_block_wrapper:last-child .card_block_upper img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 0;
        }

        .card_block_lower {
            padding: 24px 16px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            flex: 1;
        }

        .card_block_lower h1 {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .card_block_upper {
                height: 140px;
            }
            .card_block_lower h1 {
                font-size: 0.95rem;
            }
            .main_wrapper {
                padding: 20px 4vw;
                gap: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="main_wrapper">
        <a href="https://www.holcim.az/az/beton/common" class="card_block_wrapper">
            <div class="card_block">
                <div class="card_block_upper">
                    <img
                        src="https://www.holcim.az/sites/azerbaijan/files/img/beton_view_5.webp"
                        alt="Beton məhsulları"
                    />
                </div>
                <div class="card_block_lower">
                    <h1>ƏNƏNƏVİ BETON</h1>
                </div>
            </div>
        </a>

        <a href="https://www.holcim.az/az/beton/ecopact" class="card_block_wrapper">
            <div class="card_block">
                <div class="card_block_upper">
                    <img
                        src="https://www.holcim.az/sites/azerbaijan/files/img/ecopact_logo.png"
                        alt="ECOPact beton"
                    />
                </div>
                <div class="card_block_lower">
                    <h1>ECOPACT BETON</h1>
                </div>
            </div>
        </a>
    </div>
</body>
</html>
